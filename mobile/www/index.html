<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#064e2d" />
  <title>SPVN CET Portal</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="setup-card">
    <img class="logo" src="./spvn-logo.png" alt="Shardabai Pawar Vidyamandir and Vidyaniketan logo" />
    <h1>SPVN CET Portal</h1>
    <p>Student and administrator access in one mobile app.</p>
    <label for="portalUrl">Portal URL</label>
    <input id="portalUrl" type="url" inputmode="url" autocomplete="url" placeholder="https://your-portal-url" />
    <p class="hint">Ask your administrator for the live portal URL. The app will securely open the same student and admin functions available on the portal.</p>
    <button id="openPortal" type="button">Open Portal</button>
    <p id="error" class="error" role="alert" aria-live="polite"></p>
  </main>
  <script src="./app.js"></script>
</body>
</html>
